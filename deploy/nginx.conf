# Open Reader — nginx site config.
# Copy to /etc/nginx/conf.d/default.conf (the Dockerfile does it for you).
#
# The CSP is not optional: an EPUB can carry scripts and is rendered in a
# same-origin iframe, so `script-src 'self'` is what stops a malicious book
# from running code on this page. See README.md.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare injects its analytics beacon into proxied HTML; it is allowed
    # to load so the console stays clean, but connect-src stays 'self' so the
    # app cannot send anything out.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; frame-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    location /pdfjs/ {
        expires 1y;
        access_log off;
    }

    location = /index.html {
        expires -1;
    }

    # Design mockups: static pages with inline styles/scripts, kept out of the
    # app's strict CSP. Remove this block when the mockups are gone.
    location /mockups/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

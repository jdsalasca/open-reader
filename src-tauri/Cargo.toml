[package]
name = "open-reader"
version = "0.1.0"
description = "Lector de EPUB, MOBI y PDF con notas y marcadores"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

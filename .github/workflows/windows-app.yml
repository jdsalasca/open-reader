name: Windows app

# Builds Open Reader.exe (portable, no installer) and attaches it to a release
# when a tag like v0.1.0 is pushed. It can also be run by hand from the Actions
# tab; the binary shows up as a workflow artifact.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run app:build

      - name: Copy the binary to a friendly name
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "src-tauri/target/release/open-reader.exe" "release/OpenReader.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: open-reader-windows
          path: release/OpenReader.exe

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/OpenReader.exe
